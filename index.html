<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم تشخیص دیابت | دخترانه</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #d8b4fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(139, 92, 246, 0.3);
            border: 2px solid #d8b4fe;
            max-width: 550px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '🌸';
            position: absolute;
            top: -15px;
            right: -15px;
            font-size: 80px;
            opacity: 0.15;
            transform: rotate(20deg);
        }

        .container::after {
            content: '💜';
            position: absolute;
            bottom: -20px;
            left: -10px;
            font-size: 100px;
            opacity: 0.1;
            transform: rotate(-15deg);
        }

        h1 {
            text-align: center;
            color: #7e22ce;
            font-size: 28px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            text-align: center;
            color: #a855f7;
            font-size: 14px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .subtitle::before,
        .subtitle::after {
            content: '✦';
            margin: 0 10px;
            color: #c084fc;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        label {
            display: block;
            color: #6b21a8;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        label .emoji {
            margin-left: 5px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9d5ff;
            border-radius: 15px;
            font-size: 16px;
            color: #4c1d95;
            background: #faf5ff;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #a855f7;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
        }

        input::placeholder {
            color: #c4b5fd;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
            position: relative;
            z-index: 1;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.55);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 25px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            display: none;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        .result-box.diabetic {
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
            border: 2px solid #f472b6;
            color: #9d174d;
        }

        .result-box.healthy {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border: 2px solid #4ade80;
            color: #166534;
        }

        .result-box .result-icon {
            font-size: 45px;
            display: block;
            margin-bottom: 10px;
        }

        .result-box .result-text {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .result-box .result-detail {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #c084fc;
            position: relative;
            z-index: 1;
        }

        .footer .heart {
            color: #ec4899;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to left, transparent, #d8b4fe, transparent);
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>پلتفرم تشخیص دیابت</h1>
        <p class="subtitle">تشخیص هوشمند با الگوریتم درخت تصمیم</p>

        <div class="form-group">
            <label for="glucose">قند خون (Glucose) <span class="emoji">🩸</span></label>
            <input type="number" id="glucose" placeholder="مثلاً 120" step="any" min="0">
        </div>

        <div class="form-group">
            <label for="age">سن (Age) <span class="emoji">🎂</span></label>
            <input type="number" id="age" placeholder="مثلاً 30" step="any" min="0">
        </div>

        <div class="form-group">
            <label for="bmi">شاخص توده بدنی (BMI) <span class="emoji">⚖️</span></label>
            <input type="number" id="bmi" placeholder="مثلاً 25.5" step="any" min="0">
        </div>

        <div class="form-group">
            <label for="dpf">عملکرد شجره‌نامه دیابت (DPF) <span class="emoji">🧬</span></label>
            <input type="number" id="dpf" placeholder="مثلاً 0.5" step="any" min="0">
        </div>

        <button class="btn" onclick="diagnose()">🔍 تشخیص بده</button>

        <div id="resultBox" class="result-box"></div>

        <div class="divider"></div>
        <div class="footer">
            ساخته شده با <span class="heart">♥</span> برای سلامتی شما
        </div>
    </div>

    <script>
        function diagnose() {
            // دریافت مقادیر
            const glucose = parseFloat(document.getElementById('glucose').value);
            const age = parseFloat(document.getElementById('age').value);
            const bmi = parseFloat(document.getElementById('bmi').value);
            const dpf = parseFloat(document.getElementById('dpf').value);

            // اعتبارسنجی
            if (isNaN(glucose) || isNaN(age) || isNaN(bmi) || isNaN(dpf)) {
                showResult(false, '⚠️ لطفاً همه مقادیر را به درستی وارد کنید.', 'همه فیلدها الزامی هستند.');
                return;
            }

            if (glucose < 0 || age < 0 || bmi < 0 || dpf < 0) {
                showResult(false, '⚠️ مقادیر نمی‌توانند منفی باشند.', 'لطفاً مقادیر مثبت وارد کنید.');
                return;
            }

            // پیاده‌سازی دقیق درخت تصمیم
            let result = 0; // پیش‌فرض: سالم
            let path = []; // برای توضیح مسیر تصمیم

            if (glucose <= 154) {
                path.push('قند خون ≤ 154');
                if (age <= 29) {
                    path.push('سن ≤ 29');
                    result = 0;
                } else {
                    path.push('سن > 29');
                    if (bmi <= 26.700) {
                        path.push('BMI ≤ 26.7');
                        result = 0;
                    } else {
                        path.push('BMI > 26.7');
                        if (glucose <= 101) {
                            path.push('قند خون ≤ 101');
                            if (dpf <= 0.709) {
                                path.push('DPF ≤ 0.709');
                                result = 0;
                            } else {
                                path.push('DPF > 0.709');
                                result = 1;
                            }
                        } else {
                            path.push('قند خون > 101');
                            if (bmi <= 43.300) {
                                path.push('BMI ≤ 43.3');
                                if (dpf <= 0.464) {
                                    path.push('DPF ≤ 0.464');
                                    result = 0;
                                } else {
                                    path.push('DPF > 0.464');
                                    result = 1;
                                }
                            } else {
                                path.push('BMI > 43.3');
                                result = 1;
                            }
                        }
                    }
                }
            } else {
                path.push('قند خون > 154');
                if (dpf <= 0.307) {
                    path.push('DPF ≤ 0.307');
                    if (dpf <= 0.287) {
                        path.push('DPF ≤ 0.287');
                        result = 1;
                    } else {
                        path.push('DPF > 0.287');
                        result = 0;
                    }
                } else {
                    path.push('DPF > 0.307');
                    result = 1;
                }
            }

            // نمایش نتیجه
            const pathStr = path.join(' → ');
            if (result === 1) {
                showResult(true, '🩺 نتیجه: احتمال دیابت وجود دارد', 'مسیر تصمیم: ' + pathStr);
            } else {
                showResult(false, '💚 نتیجه: احتمال دیابت پایین است (سالم)', 'مسیر تصمیم: ' + pathStr);
            }
        }

        function showResult(isDiabetic, text, detail) {
            const box = document.getElementById('resultBox');
            box.style.display = 'block';
            box.className = 'result-box ' + (isDiabetic ? 'diabetic' : 'healthy');
            box.innerHTML = `
                <span class="result-icon">${isDiabetic ? '⚠️' : '🌸'}</span>
                <div class="result-text">${text}</div>
                <div class="result-detail">${detail}</div>
            `;
        }
    </script>

</body>
</html>
